name: APIsec Surface org scan

# Reusable workflow: runs in your organization on your runners. Only Surface
# analysis results are sent to APIsec.
#
# Secrets (set on the calling workflow):
#   APISEC_TOKEN                  APIsec personal access token. Required unless dry_run.
#   ORCHESTRATOR_APP_PRIVATE_KEY  Private key of a GitHub App with Contents: read and
#                                 Metadata: read, installed on the org. The installation's
#                                 repository selection is the scan scope. Recommended.
#   ORG_READ_TOKEN                Alternative to the app: fine-grained PAT with Contents: read
#                                 and Metadata: read. With neither, only public repos are visible.
#
# Org variables:
#   APISEC_ENDPOINT        APIsec API URL. Required.
#   ORCHESTRATOR_APP_ID    The GitHub App's App ID or Client ID. Used with the private key.
#   THROUGHPUT             Max parallel scans, 1-10. Default 2.
#   ORCHESTRATOR_RUNNER    github-hosted (default) | self-hosted.
#   APISEC_RUN_PROFILE     surface (default) | legacy.
#   TARGET_ORG             Scan another org than the caller's.
#   EXCLUDE_REPOS          Comma-separated owner/repo names to skip.
#   APISEC_LLM_ENRICHMENT  0 to keep source snippets out of LLM gap-filling.
#   APISEC_REGISTRATION_CODE  Registration code for scanned apps. Default ci-orchestrator.
#   APISEC_CLI_VERSION     Pin the Surface CLI version. Default: newest compatible 1.x.

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      force_full_scan:
        type: boolean
        default: false
      max_repos:
        type: number
        default: 0
      throughput:
        type: number
        default: 0
      runner:
        type: string
        default: ''
      run_profile:
        type: string
        default: ''
    secrets:
      APISEC_TOKEN:
        required: false
      ORG_READ_TOKEN:
        required: false
      ORCHESTRATOR_APP_PRIVATE_KEY:
        required: false

env:
  ORGSCAN_SPEC: apisec-orgscan>=1.1,<2

jobs:
  plan:
    name: Plan
    runs-on: ${{ (inputs.runner || vars.ORCHESTRATOR_RUNNER) == 'self-hosted' && fromJSON('["self-hosted","apisec"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      run_profile: ${{ steps.plan.outputs.run_profile }}
      cli_version: ${{ steps.plan.outputs.cli_version }}
      orgscan_version: ${{ steps.orgscan.outputs.version }}
      throughput: ${{ steps.plan.outputs.throughput }}
    env:
      # Steps cannot test secrets in `if:`, so decide app mode once per job.
      USE_APP: ${{ vars.ORCHESTRATOR_APP_ID != '' && secrets.ORCHESTRATOR_APP_PRIVATE_KEY != '' }}
    steps:
      # Installation tokens live one hour, so every job mints its own.
      - name: Mint GitHub App token
        id: app-token
        if: env.USE_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ORCHESTRATOR_APP_ID }}
          private-key: ${{ secrets.ORCHESTRATOR_APP_PRIVATE_KEY }}
          owner: ${{ vars.TARGET_ORG || github.repository_owner }}
          permission-contents: read
      - name: Explain GitHub App failure
        if: failure() && steps.app-token.outcome == 'failure'
        env:
          APP_ID: ${{ vars.ORCHESTRATOR_APP_ID }}
          OWNER: ${{ vars.TARGET_ORG || github.repository_owner }}
        run: |
          echo "::error title=APIsec Surface::GitHub App $APP_ID (ORCHESTRATOR_APP_ID) could not get a token for '$OWNER'. Install the app on that org and grant it Contents: read and Metadata: read, or check ORCHESTRATOR_APP_PRIVATE_KEY."
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Newest compatible release, resolved once so every job in the run uses it.
      - id: orgscan
        run: |
          pip install --quiet --upgrade "$ORGSCAN_SPEC"
          echo "version=$(apisec-orgscan --version)" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          TARGET_ORG: ${{ vars.TARGET_ORG || github.repository_owner }}
          EXCLUDE_REPOS: ${{ vars.EXCLUDE_REPOS }}
          FORCE_FULL_SCAN: ${{ inputs.force_full_scan }}
          MAX_REPOS: ${{ inputs.max_repos }}
          IN_THROUGHPUT: ${{ inputs.throughput }}
          THROUGHPUT: ${{ vars.THROUGHPUT }}
          IN_RUN_PROFILE: ${{ inputs.run_profile }}
          APISEC_RUN_PROFILE: ${{ vars.APISEC_RUN_PROFILE }}
          APISEC_CLI_VERSION: ${{ vars.APISEC_CLI_VERSION }}
        run: apisec-orgscan plan

  scan:
    name: Scan ${{ matrix.repo_name }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ (inputs.runner || vars.ORCHESTRATOR_RUNNER) == 'self-hosted' && fromJSON('["self-hosted","apisec"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
      max-parallel: ${{ fromJSON(needs.plan.outputs.throughput) }}
      fail-fast: false
    env:
      USE_APP: ${{ vars.ORCHESTRATOR_APP_ID != '' && secrets.ORCHESTRATOR_APP_PRIVATE_KEY != '' }}
    steps:
      # Minted here rather than passed from plan: a run can outlast the token's
      # hour. Narrowed to the one repo this job checks out.
      - name: Mint GitHub App token
        id: app-token
        if: env.USE_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ORCHESTRATOR_APP_ID }}
          private-key: ${{ secrets.ORCHESTRATOR_APP_PRIVATE_KEY }}
          owner: ${{ vars.TARGET_ORG || github.repository_owner }}
          repositories: ${{ matrix.repo_name }}
          permission-contents: read
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        env:
          ORGSCAN_VERSION: ${{ needs.plan.outputs.orgscan_version }}
          CLI_VERSION: ${{ needs.plan.outputs.cli_version }}
        run: |
          pip install --quiet "apisec-orgscan==$ORGSCAN_VERSION" "apisec-surface==$CLI_VERSION"
          apisec-surface telemetry off || true
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo_full_name }}
          token: ${{ steps.app-token.outputs.token || secrets.ORG_READ_TOKEN || github.token }}
          path: repos/${{ matrix.repo_name }}
          fetch-depth: 1
      - name: Analyze
        env:
          REPO_NAME: ${{ matrix.repo_name }}
          REPO_ID: ${{ matrix.repo_id }}
          REPO_FULL_NAME: ${{ matrix.repo_full_name }}
          SCANNED_BEFORE: ${{ matrix.scanned_before }}
          APISEC_PAT: ${{ secrets.APISEC_TOKEN }}
          APISEC_ENDPOINT: ${{ vars.APISEC_ENDPOINT }}
          APISEC_LLM_ENRICHMENT: ${{ vars.APISEC_LLM_ENRICHMENT }}
          APISEC_REGISTRATION_CODE: ${{ vars.APISEC_REGISTRATION_CODE }}
          RUN_PROFILE: ${{ needs.plan.outputs.run_profile }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: apisec-orgscan scan "repos/$REPO_NAME" --repo-id "$REPO_ID" --repo-full-name "$REPO_FULL_NAME"
      - name: Record
        if: ${{ !inputs.dry_run }}
        env:
          REPO_ID: ${{ matrix.repo_id }}
          PUSHED_AT: ${{ matrix.pushed_at }}
        run: apisec-orgscan record --repo-id "$REPO_ID" --pushed-at "$PUSHED_AT"
      - if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ts-update-${{ matrix.repo_id }}
          path: ts-updates/${{ matrix.repo_id }}.json
          retention-days: 1

  update-store:
    name: Update store
    needs: [plan, scan]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ${{ (inputs.runner || vars.ORCHESTRATOR_RUNNER) == 'self-hosted' && fromJSON('["self-hosted","apisec"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          ORGSCAN_VERSION: ${{ needs.plan.outputs.orgscan_version }}
        run: pip install --quiet "apisec-orgscan==$ORGSCAN_VERSION"
      - uses: actions/download-artifact@v4
        with:
          pattern: ts-update-*
          path: ts-updates
          merge-multiple: true
        continue-on-error: true
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: apisec-orgscan merge
      - uses: actions/upload-artifact@v4
        with:
          name: push-ts-store
          path: .cache/push-ts-store.json
          retention-days: 90
          overwrite: true
